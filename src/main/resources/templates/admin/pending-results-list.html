<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Risultati in sospeso</title>
</head>
<body>

<h1>Risultati in sospeso</h1>

<p th:if="${message}" th:text="${message}" style="color:green"></p>
<p th:if="${error}" th:text="${error}" style="color:red"></p>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>File</th>
        <th>Pista</th>
        <th>Ricevuto</th>
        <th>Azioni</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="p : ${pendingResults}">
        <td th:text="${p.id}">1</td>
        <td th:text="${p.filename}">file.json</td>
        <td th:text="${p.trackName}">imola</td>
        <td th:text="${#temporals.format(p.receivedAt, 'dd/MM/yyyy HH:mm')}">01/01/2026 20:00</td>
        <td>
            <a th:href="@{/admin/pending-results/{id}(id=${p.id})}">Rivedi</a>
            <form th:action="@{/admin/pending-results/{id}/delete(id=${p.id})}" method="post" style="display:inline">
                <button type="submit" onclick="return confirm('Scartare questo risultato?')">Scarta</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<p th:if="${#lists.isEmpty(pendingResults)}">Nessun risultato in attesa.</p>

</body>
</html>
