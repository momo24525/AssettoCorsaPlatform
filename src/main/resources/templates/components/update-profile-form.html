<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="update-profile-form">

    <div class="card-update-profile">

        <form th:action="@{/api/profile/update}" method="post" class="update-profile-form">
            <h4 class="card-title">CREATE DRIVER PROFILE</h4>
            <div class="input-group-custom">
                <p class="label">Username</p>
                <input type="text"
                       name="username"
                       class="form-input-custom"
                       placeholder="Insert username"
                       required>
            </div>
            <button type="submit" class="btn btn-card">
                <i class="bi bi-pencil-square"></i> Salva
            </button>
        </form>
    </div>

</div>
</body>
</html>
